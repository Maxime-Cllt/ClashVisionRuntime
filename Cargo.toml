[package]
name = "ClashVisionRuntime"
version = "0.8.0"
license = "GPL-3.0"
repository = "https://github.com/Maxime-Cllt/ClashVisionRuntime.git"
categories = ["accessibility", "command-line-interface"]
keywords = ["machine-learning", "ai", "computer-vision", "image-processing", "onnx"]
authors = ["Maxime-Cllt"]
edition = "2024"


[dependencies]
# Only the codecs actually used: png (inputs) and jpeg (annotated output in `process_image`).
# image's default features would also compile avif/exr/tiff/gif/webp/bmp/... encoders+decoders.
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"] }
# Same major as tract's ndarray so tensors cross the tract boundary without copies/bridging.
ndarray = "0.17"
# Inference engine: tract is 100% pure Rust (no C/C++, no onnxruntime DLL). It loads the
# embedded ONNX model and runs on CPU, so the whole crate links into a single static binary
# with nothing to ship or install — critical for painless Windows deployment.
tract-onnx = "0.23"
# Only rectangles are drawn: skip the default `text` feature (font-kit + platform font libs).
raqote = { version = "0.8.4", default-features = false }
thiserror = "2.0.17"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
fast_image_resize = { version = "6.0.0", features = ["image"] }
# Optional global allocator for the binary/benches (`--features mimalloc`). Never forced on library consumers.
mimalloc = { version = "0.1", default-features = false, optional = true }


[features]
default = []
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.23.0"

[lib]
name = "clashvision"
path = "src/lib.rs"
crate-type = ["rlib"]

[profile.dev]
# Development profile for debug builds
opt-level = 0  # No optimizations, better debugging info
debug = true  # Generate debug info
overflow-checks = true  # Enable overflow checks for safer code
lto = false  # Disable Link Time Optimization for faster compilation
panic = "unwind" # Use unwind strategy to get better backtraces

[profile.test]
# Test profile for optimized builds
incremental = true  # Enable incremental compilation for faster test builds
opt-level = 1  # Optimize for speed, but not as much as release
debug = false  # No debug info in test builds
overflow-checks = true  # Enable overflow checks for safer code
lto = false  # Disable Link Time Optimization for faster compilation

[profile.release]
# Release profile for optimized builds
incremental = false
opt-level = 3  # Optimize for speed
debug = false  # No debug info in release builds
lto = "fat"    # Better than just `true` for performance
codegen-units = 1  # Merge codegen units for better optimization (can increase compile time)
overflow-checks = false  # Disable overflow checks for performance
panic = "abort" # Use unwind strategy to get better backtraces.
strip = "symbols"     # Strip debug symbols to reduce binary size


[profile.bench]
# Benchmark profile for performance testing (matches release)
incremental = false
opt-level = 3
debug = false
overflow-checks = false
lto = "fat"
codegen-units = 1


[[bench]]
name = "benchmark_application"
harness = false
path = "benches/application_bench.rs"